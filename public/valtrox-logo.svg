<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Bedrock Union">
  <defs>
    <!-- Blocky letterforms (Minecraft Ten style) -->
    <path id="buB" fill-rule="evenodd" d="M0 0 H260 V180 H200 V220 H260 V400 H0 Z M60 60 H200 V170 H60 Z M60 230 H200 V340 H60 Z"/>
    <path id="buU" fill-rule="evenodd" d="M0 0 H60 V340 H200 V0 H260 V400 H0 Z"/>

    <linearGradient id="buBlue" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8FE8FF"/>
      <stop offset="0.35" stop-color="#35B6F7"/>
      <stop offset="0.72" stop-color="#1273D4"/>
      <stop offset="1" stop-color="#0A4FA8"/>
    </linearGradient>

    <linearGradient id="buGold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.32" stop-color="#FFD24A"/>
      <stop offset="0.7" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#C2610A"/>
    </linearGradient>

    <clipPath id="buBClip"><use href="#buB" clip-rule="evenodd"/></clipPath>
    <clipPath id="buUClip"><use href="#buU" clip-rule="evenodd"/></clipPath>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="350" cy="466" rx="296" ry="24" fill="#04122A" opacity="0.34"/>

  <!-- ===================== B (blue) ===================== -->
  <g transform="translate(40,32)">
    <!-- extrusion: stacked offset copies going down-right -->
    <g stroke-linejoin="round">
      <use href="#buB" x="20" y="20" fill="#03142F" stroke="#03142F" stroke-width="14"/>
      <use href="#buB" x="16" y="16" fill="#041B3D" stroke="#041B3D" stroke-width="14"/>
      <use href="#buB" x="12" y="12" fill="#06244F" stroke="#06244F" stroke-width="14"/>
      <use href="#buB" x="8"  y="8"  fill="#082E62" stroke="#082E62" stroke-width="14"/>
      <use href="#buB" x="4"  y="4"  fill="#0A3875" stroke="#0A3875" stroke-width="14"/>
    </g>
    <!-- front face -->
    <use href="#buB" fill="url(#buBlue)" stroke="#04122A" stroke-width="10" stroke-linejoin="round"/>
    <!-- pixel highlights -->
    <g clip-path="url(#buBClip)" fill="#DFF6FF">
      <rect x="14" y="70" width="26" height="26" opacity="0.72"/>
      <rect x="18" y="150" width="16" height="16" opacity="0.55"/>
      <rect x="14" y="290" width="26" height="26" opacity="0.70"/>
      <rect x="96" y="18" width="22" height="22" opacity="0.55"/>
      <rect x="150" y="20" width="16" height="16" opacity="0.40"/>
      <rect x="150" y="176" width="18" height="18" opacity="0.50"/>
      <rect x="222" y="20" width="22" height="22" opacity="0.45"/>
      <rect x="224" y="140" width="18" height="18" opacity="0.40"/>
      <rect x="222" y="250" width="22" height="22" opacity="0.42"/>
      <rect x="70" y="358" width="20" height="20" opacity="0.45"/>
    </g>
  </g>

  <!-- ===================== U (gold) ===================== -->
  <g transform="translate(360,32)">
    <g stroke-linejoin="round">
      <use href="#buU" x="20" y="20" fill="#2A0D02" stroke="#2A0D02" stroke-width="14"/>
      <use href="#buU" x="16" y="16" fill="#3F1605" stroke="#3F1605" stroke-width="14"/>
      <use href="#buU" x="12" y="12" fill="#5B2109" stroke="#5B2109" stroke-width="14"/>
      <use href="#buU" x="8"  y="8"  fill="#7C2D12" stroke="#7C2D12" stroke-width="14"/>
      <use href="#buU" x="4"  y="4"  fill="#9A410D" stroke="#9A410D" stroke-width="14"/>
    </g>
    <use href="#buU" fill="url(#buGold)" stroke="#2A0D02" stroke-width="10" stroke-linejoin="round"/>
    <g clip-path="url(#buUClip)" fill="#FFF7CC">
      <rect x="14" y="60" width="22" height="22" opacity="0.68"/>
      <rect x="18" y="190" width="16" height="16" opacity="0.50"/>
      <rect x="16" y="300" width="20" height="20" opacity="0.45"/>
      <rect x="222" y="80" width="20" height="20" opacity="0.60"/>
      <rect x="224" y="220" width="16" height="16" opacity="0.45"/>
      <rect x="226" y="320" width="18" height="18" opacity="0.40"/>
      <rect x="100" y="356" width="20" height="20" opacity="0.40"/>
    </g>
  </g>
</svg>
